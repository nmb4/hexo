[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
license = "MIT"
publish = false
edition = "2024"
version = "0.3.0"
rust-version = "1.88"

[workspace.dependencies]
exo-ui = { path = "crates/exo-ui" }
exo-mail = { path = "crates/exo-mail" }
exo-auth = { path = "crates/exo-auth" }
exo-store = { path = "crates/exo-store" }
exo-fonts = { path = "crates/exo-fonts" }
exo-commands = { path = "crates/exo-commands" }

# Cross-platform web and data stack.
url = "2"
log = "0.4"
regex = "1"
base64 = "0.22"
gif = "0.14"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["net", "sync", "time", "signal", "macros", "rt-multi-thread"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = { version = "3", features = ["sync-secret-service"] }
dirs = "6"

# HEY's official Rust SDK.
hey-sdk = "0.36"

# UI stack: egui/eframe + fastframe + Blitz (kept from Exo).
egui = "0.36.2"
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "glow", "links", "accesskit"] }
egui_extras = { version = "0.36.2", default-features = false }
egui_kittest = { version = "0.36.2", features = ["wgpu"] }
arboard = { version = "3.7", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
peniko = "0.6"
parley = { version = "0.13", default-features = false, features = ["system"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
anyrender = "0.15"
anyrender_vello_cpu = { version = "0.19", features = ["multithreading"] }
html5ever = "0.40"
markup5ever_rcdom = "=0.40.1"
fancy-regex = "0.14"
unicode-normalization = "0.1"
memmap2 = "0.9"
getrandom = "0.3"

# fastframe: the native-shell helpers Exo uses.
fastframe-dirs = { git = "https://github.com/m1guelpf-forks/fastframe", branch = "notification-subtitle" }
fastframe-emoji = { git = "https://github.com/m1guelpf-forks/fastframe", branch = "notification-subtitle" }
fastframe-log = { git = "https://github.com/m1guelpf-forks/fastframe", branch = "notification-subtitle" }
fastframe-notifications = { git = "https://github.com/m1guelpf-forks/fastframe", branch = "notification-subtitle" }

# Blitz HTML email renderer (Exo's fork).
blitz-html = { git = "https://github.com/m1guelpf-forks/blitz", branch = "inline-box-decorations" }
blitz-traits = { git = "https://github.com/m1guelpf-forks/blitz", branch = "inline-box-decorations" }
blitz-paint = { git = "https://github.com/m1guelpf-forks/blitz", branch = "inline-box-decorations", default-features = false, features = ["svg"] }
blitz-dom = { git = "https://github.com/m1guelpf-forks/blitz", branch = "inline-box-decorations", default-features = false, features = ["svg", "woff", "floats", "system-fonts"] }
style_config = { version = "0.24.0", package = "stylo_static_prefs" }

[patch.crates-io]
egui = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
emath = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
ecolor = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
eframe = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
epaint = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
winit = { git = "https://github.com/crmne/winit", rev = "ed7caa9023f10b397f5b6ec8284a840cbd8a6f65" }
egui-wgpu = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
egui_glow = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
egui-winit = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
egui_extras = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
egui_kittest = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
epaint_default_fonts = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
